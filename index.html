<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Snake Game</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
    font-family: Courier, monospace;
  }
  #scoreDisplay {
    color: white;
    font-family: Tahoma, sans-serif;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 8px;
  }
  #board {
    background: black;
    display: block;
    aspect-ratio: 1 / 1;
    width: min(100vw, calc(100vh - 50px));
    height: min(100vw, calc(100vh - 50px));
  }
</style>
</head>
<body style="position: relative;">
<div id="scoreDisplay">Score: 0</div>
<canvas id="board" width="600" height="600"></canvas>
<script>
if (window.Telegram && window.Telegram.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}

// ---- constants (mirrors STARTING_POSITIONS / MOVE_DISTANCE / headings in snake.py) ----
const MOVE_DISTANCE = 20;
const UP = 90, DOWN = 270, LEFT = 180, RIGHT = 0;
const BOUNDARY = 280;
const FOOD_CATCH_DIST = 15;
const SELF_COLLIDE_DIST = 10;
const FOOD_MARGIN = 20; // keeps food from spawning on/touching the wall line
let TICK_MS = 100;
let pointsPerFood = 1;

const canvas = document.getElementById("board");
const ctx = canvas.getContext("2d");
const scoreDisplay = document.getElementById("scoreDisplay");
const W = canvas.width, H = canvas.height;

// convert turtle coords (origin center, y up) -> canvas coords (origin top-left, y down)
function toCanvas(x, y) {
  return { cx: W / 2 + x, cy: H / 2 - y };
}

// ---- Snake ----
class Snake {
  constructor() {
    this.segments = [
      { x: 0, y: 0 },
      { x: -20, y: 0 },
      { x: -40, y: 0 }
    ];
    this.heading = RIGHT;
  }
  get head() {
    return this.segments[0];
  }
  extend() {
    const tail = this.segments[this.segments.length - 1];
    this.segments.push({ x: tail.x, y: tail.y });
  }
  move() {
    for (let i = this.segments.length - 1; i > 0; i--) {
      this.segments[i].x = this.segments[i - 1].x;
      this.segments[i].y = this.segments[i - 1].y;
    }
    const rad = (this.heading * Math.PI) / 180;
    this.head.x += MOVE_DISTANCE * Math.cos(rad);
    this.head.y += MOVE_DISTANCE * Math.sin(rad);
  }
  up() { if (this.heading !== DOWN) this.heading = UP; }
  down() { if (this.heading !== UP) this.heading = DOWN; }
  left() { if (this.heading !== RIGHT) this.heading = LEFT; }
  right() { if (this.heading !== LEFT) this.heading = RIGHT; }
}

// ---- Food ----
class Food {
  constructor() {
    this.refresh();
  }
  refresh() {
    const range = BOUNDARY - FOOD_MARGIN;
    this.x = Math.floor(Math.random() * (range * 2)) - range;
    this.y = Math.floor(Math.random() * (range * 2)) - range;
  }
}

// ---- Scoreboard ----
class Scoreboard {
  constructor() {
    this.score = 0;
  }
  increaseScore(points) {
    this.score += points;
  }
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function updateScoreDisplay() {
  scoreDisplay.textContent = `Score: ${scoreboard.score}`;
}

// ---- Game setup ----
let snake = new Snake();
let food = new Food();
let scoreboard = new Scoreboard();
let gameIsOn = false;
let intervalId = null;

function drawSquare(x, y, size, color) {
  const { cx, cy } = toCanvas(x, y);
  ctx.fillStyle = color;
  ctx.fillRect(cx - size / 2, cy - size / 2, size, size);
}

function drawCircle(x, y, radius, color) {
  const { cx, cy } = toCanvas(x, y);
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
}

function drawText(x, y, text, size, color) {
  const { cx, cy } = toCanvas(x, y);
  ctx.fillStyle = color;
  ctx.font = `${size}px Courier`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText(text, cx, cy);
}

function render() {
  ctx.clearRect(0, 0, W, H);

  // visible wall boundary
  ctx.strokeStyle = "#444";
  ctx.lineWidth = 2;
  const { cx: x1, cy: y1 } = toCanvas(-BOUNDARY, BOUNDARY);
  ctx.strokeRect(x1, y1, BOUNDARY * 2, BOUNDARY * 2);

  // snake segments (white squares, like Turtle("square"))
  for (const seg of snake.segments) {
    drawSquare(seg.x, seg.y, 20, "white");
  }

  // food (blue circle, shapesize 0.5 -> ~10px radius)
  drawCircle(food.x, food.y, 7, "#3498ff");

  updateScoreDisplay();
}

function tick() {
  if (!gameIsOn) return;

  snake.move();

  if (distance(snake.head, food) < FOOD_CATCH_DIST) {
    food.refresh();
    snake.extend();
    scoreboard.increaseScore(pointsPerFood);
    submitLiveScore(scoreboard.score);
  }

  // wrap-around: re-emerge flush with the drawn wall instead of dying
  const SEG_HALF = 10; // half the snake segment's width
  if (snake.head.x > BOUNDARY - SEG_HALF) snake.head.x = -(BOUNDARY - SEG_HALF);
  if (snake.head.x < -(BOUNDARY - SEG_HALF)) snake.head.x = BOUNDARY - SEG_HALF;
  if (snake.head.y > BOUNDARY - SEG_HALF) snake.head.y = -(BOUNDARY - SEG_HALF);
  if (snake.head.y < -(BOUNDARY - SEG_HALF)) snake.head.y = BOUNDARY - SEG_HALF;

  for (const seg of snake.segments.slice(1)) {
    if (distance(snake.head, seg) < SELF_COLLIDE_DIST) {
      endGame();
      return;
    }
  }

  render();
}

function endGame() {
  gameIsOn = false;
  clearInterval(intervalId);
  render();
  drawText(0, 20, "GAME OVER", 24, "white");
  submitScore(scoreboard.score); // hook for Telegram / backend
  showReplayButton();
}

function styleButton(btn) {
  btn.style.padding = "6px 12px";
  btn.style.fontSize = "13px";
  btn.style.fontFamily = "Tahoma, sans-serif";
  btn.style.fontWeight = "bold";
  btn.style.background = "white";
  btn.style.color = "black";
  btn.style.border = "none";
  btn.style.borderRadius = "6px";
  btn.style.cursor = "pointer";
  btn.style.width = "120px";
  btn.style.textAlign = "left";
}

function showReplayButton() {
  const btn = document.createElement("button");
  btn.textContent = "🔁 Play Again";
  styleButton(btn);
  btn.style.position = "absolute";
  btn.style.top = "68%";
  btn.style.left = "50%";
  btn.style.transform = "translate(-50%, -50%)";
  btn.style.textAlign = "center";
  btn.id = "replayBtn";

  btn.onclick = () => {
    btn.remove();
    showDifficultyMenu();
  };

  document.body.appendChild(btn);
}

function showDifficultyMenu() {
  const menu = document.createElement("div");
  menu.id = "difficultyMenu";
  menu.style.position = "absolute";
  menu.style.top = "50%";
  menu.style.left = "50%";
  menu.style.transform = "translate(-50%, -50%)";
  menu.style.display = "flex";
  menu.style.flexDirection = "column";
  menu.style.gap = "10px";
  menu.style.alignItems = "center";

  const title = document.createElement("div");
  title.textContent = "Choose difficulty";
  title.style.color = "white";
  title.style.fontFamily = "Tahoma, sans-serif";
  title.style.fontWeight = "bold";
  title.style.fontSize = "16px";
  title.style.marginBottom = "6px";
  menu.appendChild(title);

  const difficulties = [
    { label: "🟢 Easy", tick: 150, points: 1 },
    { label: "🟡 Medium", tick: 100, points: 2 },
    { label: "🔴 Hard", tick: 60, points: 3 },
  ];

  difficulties.forEach((d) => {
    const btn = document.createElement("button");
    btn.textContent = d.label;
    styleButton(btn);
    btn.onclick = () => {
      TICK_MS = d.tick;
      pointsPerFood = d.points;
      menu.remove();
      startGame();
    };
    menu.appendChild(btn);
  });

  document.body.appendChild(menu);
}

function startGame() {
  snake = new Snake();
  food = new Food();
  scoreboard = new Scoreboard();
  gameIsOn = true;
  render();
  intervalId = setInterval(tick, TICK_MS);
}

// ---- Telegram Mini App score hooks ----
function submitScore(finalScore) {
  const telegramId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "anonymous";
  const username = window.Telegram?.WebApp?.initDataUnsafe?.user?.username || null;

  fetch("https://snake-bot-backend-production.up.railway.app/score", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ telegramId, username, score: finalScore })
  }).catch((err) => console.error("Failed to submit score:", err));
}

function submitLiveScore(currentScore) {
  const telegramId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || "anonymous";

  fetch("https://snake-bot-backend-production.up.railway.app/score/live", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ telegramId, score: currentScore })
  }).catch(() => {}); // fire-and-forget, don't interrupt gameplay if it fails
}

// ---- Controls ----
document.addEventListener("keydown", (e) => {
  switch (e.key) {
    case "ArrowUp": snake.up(); break;
    case "ArrowDown": snake.down(); break;
    case "ArrowLeft": snake.left(); break;
    case "ArrowRight": snake.right(); break;
  }
});

// basic touch swipe support (useful inside Telegram's WebView on mobile)
let touchStartX = 0, touchStartY = 0;
canvas.addEventListener("touchstart", (e) => {
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
});
canvas.addEventListener("touchend", (e) => {
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if (Math.abs(dx) > Math.abs(dy)) {
    dx > 0 ? snake.right() : snake.left();
  } else {
    dy > 0 ? snake.down() : snake.up();
  }
});

// ---- Start ----
showDifficultyMenu();
</script>
</body>
</html>
